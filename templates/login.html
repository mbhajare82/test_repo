{% extends "base.html" %}
{% block title %}Login — {{ brand_name }}{% endblock %}

{% block content %}
<section class="section auth-section">
    <div class="container">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Log in to your {{ brand_name }} account</p>
            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Log In</button>
            </form>
            <p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
            <p class="auth-footer"><a href="{{ url_for('admin_login') }}">Admin Login →</a></p>
        </div>
    </div>
</section>
{% endblock %}
