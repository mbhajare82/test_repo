{% extends "base.html" %}
{% block title %}{% if product %}Edit{% else %}Add{% endif %} Product — Admin{% endblock %}

{% block content %}
<section class="page-header admin-header">
    <div class="container">
        <h1>{% if product %}Edit Product{% else %}Add New Product{% endif %}</h1>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="admin-form-card">
            <form method="POST" class="admin-form">
                <div class="form-group">
                    <label for="name">Product Name *</label>
                    <input type="text" id="name" name="name" required
                           value="{{ product.name if product else '' }}">
                </div>
                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" name="description" rows="4" required>{{ product.description if product else '' }}</textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="price">Price (₹) *</label>
                        <input type="number" id="price" name="price" step="1" min="1" required
                               value="{{ product.price|int if product else '' }}">
                    </div>
                    <div class="form-group">
                        <label for="stock">Stock *</label>
                        <input type="number" id="stock" name="stock" min="0" required
                               value="{{ product.stock if product else 0 }}">
                    </div>
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" name="category" required>
                            <option value="sweets" {% if product and product.category == 'sweets' %}selected{% endif %}>Sweets</option>
                            <option value="namkins" {% if product and product.category == 'namkins' %}selected{% endif %}>Namkins</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="image_url">Image URL *</label>
                    <input type="url" id="image_url" name="image_url" required
                           value="{{ product.image_url if product else '' }}"
                           placeholder="https://upload.wikimedia.org/wikipedia/commons/...">
                    {% if product %}
                    <div class="image-preview">
                        <img src="{{ product.image_url }}" alt="Preview" id="imagePreview">
                    </div>
                    {% endif %}
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">{% if product %}Update Product{% else %}Add Product{% endif %}</button>
                    <a href="{{ url_for('admin_products') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
