{% extends "base.html" %}
{% block title %}Admin Login — {{ brand_name }}{% endblock %}

{% block content %}
<section class="section auth-section admin-auth">
    <div class="container">
        <div class="auth-card admin-card">
            <h1>🔐 Admin Login</h1>
            <p class="auth-subtitle">Inventory Management Portal</p>
            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Admin Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login to Dashboard</button>
            </form>
            <div class="admin-credentials">
                <p><strong>Demo Admin Accounts:</strong></p>
                <ul>
                    <li>admin1 / admin123</li>
                    <li>admin2 / sweets2024</li>
                    <li>mataji / aai@123</li>
                </ul>
            </div>
            <p class="auth-footer"><a href="{{ url_for('index') }}">← Back to Store</a></p>
        </div>
    </div>
</section>
{% endblock %}
